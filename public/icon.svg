<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle outline -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Building Main Tower -->
  <rect x="112" y="140" width="200" height="260" rx="16" fill="#334155" />
  
  <!-- Building Left Wing -->
  <rect x="72" y="220" width="70" height="180" rx="12" fill="#1e293b" />
  
  <!-- Windows Matrix on Tower -->
  <rect x="140" y="170" width="32" height="28" rx="6" fill="#94a3b8"/>
  <rect x="196" y="170" width="32" height="28" rx="6" fill="#fbbf24"/>
  <rect x="252" y="170" width="32" height="28" rx="6" fill="#94a3b8"/>

  <rect x="140" y="220" width="32" height="28" rx="6" fill="#fbbf24"/>
  <rect x="196" y="220" width="32" height="28" rx="6" fill="#94a3b8"/>
  <rect x="252" y="220" width="32" height="28" rx="6" fill="#fbbf24"/>

  <rect x="140" y="270" width="32" height="28" rx="6" fill="#94a3b8"/>
  <rect x="196" y="270" width="32" height="28" rx="6" fill="#fbbf24"/>
  <rect x="252" y="270" width="32" height="28" rx="6" fill="#94a3b8"/>

  <rect x="140" y="320" width="32" height="28" rx="6" fill="#fbbf24"/>
  <rect x="196" y="320" width="32" height="28" rx="6" fill="#94a3b8"/>
  <rect x="252" y="320" width="32" height="28" rx="6" fill="#fbbf24"/>

  <!-- Main Entrance -->
  <rect x="180" y="360" width="64" height="40" rx="8" fill="#0f172a"/>

  <!-- Prominent Energy Lightning Badge in Foreground -->
  <circle cx="360" cy="300" r="92" fill="#0f172a" stroke="#fbbf24" stroke-width="8"/>
  <circle cx="360" cy="300" r="80" fill="url(#gold)"/>

  <!-- Electricity Bolt in Badge -->
  <path d="M374 236 L326 304 L356 304 L344 364 L396 292 L364 292 Z" fill="#ffffff" stroke="#fef3c7" stroke-width="2" stroke-linejoin="round"/>
</svg>
